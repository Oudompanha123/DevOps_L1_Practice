spring.application.name=twitter-app
spring.datasource.url=jdbc:h2:mem:twitterapp
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

spring.thymeleaf.cache=false

# H2 Console settings
spring.h2.console.path=/h2-console

# --- Monitoring & Observability ---

# Expose Actuator endpoints (Prometheus, Health, Info, Metrics)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Add Application Name as a Tag for Prometheus Metrics
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Micrometer Tracing configuration (1.0 = 100% of traces)
management.tracing.sampling.probability=1.0

# OTLP Exporter Endpoint (Tempo)
management.otlp.tracing.endpoint=http://tempo.monitoring.svc.cluster.local:4318/v1/traces
management.opentelemetry.resource-attributes.service.name=${spring.application.name}

# Inject Trace ID and Span ID into standard logs (which Promtail will forward to Loki)
logging.pattern.level=%5p [app=${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}]
